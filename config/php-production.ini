; Recommended PHP settings for the CRM in production (cPanel: "MultiPHP INI Editor" or "Select PHP Version → Options").
; OPcache is the single biggest PHP speed-up: compiled scripts stay in memory instead of being parsed on every request.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=60          ; re-check changed files at most once a minute (set 0 while developing)
opcache.save_comments=0

; APCu (if the "apcu" extension is available) gives the CRM an in-memory cache instead of file cache.
apc.enabled=1
apc.shm_size=64M

realpath_cache_size=4096K
realpath_cache_ttl=600

memory_limit=256M
max_execution_time=60
max_input_time=60
post_max_size=8M
upload_max_filesize=4M

session.gc_maxlifetime=28800
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax

zlib.output_compression=Off         ; compression is done by Apache (mod_deflate/brotli via .htaccess)
expose_php=Off
display_errors=Off
log_errors=On
